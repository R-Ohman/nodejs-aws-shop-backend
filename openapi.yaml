openapi: 3.0.1
info:
  title: Product Service API
  version: 1.0.0
servers:
  - url: https://2cj5mkpgya.execute-api.eu-north-1.amazonaws.com/prod
    description: Deployed API Gateway endpoint

paths:
  /products:
    get:
      summary: Get products list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{productId}:
    get:
      summary: Get product by id
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Product id is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /import:
    get:
      summary: Get signed URL for product CSV upload
      description: Returns a plain signed URL string for uploading a file to S3 under uploaded/{name}.
      servers:
        - url: https://replace-with-import-api-id.execute-api.eu-north-1.amazonaws.com/prod
          description: Import Service API endpoint
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          description: CSV file name to upload
      responses:
        '200':
          description: Signed URL string
          content:
            text/plain:
              schema:
                type: string
                format: uri
        '400':
          description: Missing name query parameter
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: UUID of the product
        title:
          type: string
          description: Product title
        description:
          type: string
          description: Product description
        price:
          type: number
          description: Product price
        count:
          type: integer
          description: Product stock count from Stocks table
      required:
        - id
        - title
        - price
        - count
    CreateProductRequest:
      type: object
      properties:
        title:
          type: string
          description: Product title (required, non-empty)
        description:
          type: string
          description: Product description (optional)
        price:
          type: number
          description: Product price (required, >= 0)
        count:
          type: integer
          description: Initial stock count (required, >= 0)
      required:
        - title
        - price
        - count
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
